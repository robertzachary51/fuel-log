<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuel Log">
<meta name="theme-color" content="#1F3A4A">
<title>Fuel Log</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --ink:#1C2B33; --muted:#5B6B73; --line:#D3DBD8; --track:#E1E7E4;
  --head:#1F3A4A; --head-ink:#F2F6F5; --accent:#1F3A4A;
  --kcal:#1F3A4A; --protein:#2C7A8C; --fat:#B9821A; --carb:#5D8A33; --fiber:#8C6A4C; --water:#2D77B6; --supp:#7A5C9E; --over:#B4452E;
  --num:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --body:'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A1F; --surface:#1A242A; --ink:#E3EAEC; --muted:#94A4AB; --line:#2B3940; --track:#26333A;
    --head:#0E1A21; --head-ink:#E3EAEC; --accent:#9CC6D8;
    --kcal:#9CC6D8; --protein:#5FB3C6; --fat:#E0AE47; --carb:#8DBB5E; --fiber:#C29B78; --water:#63A9E3; --supp:#B597DA; --over:#E07A61;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A1F; --surface:#1A242A; --ink:#E3EAEC; --muted:#94A4AB; --line:#2B3940; --track:#26333A;
  --head:#0E1A21; --head-ink:#E3EAEC; --accent:#9CC6D8;
  --kcal:#9CC6D8; --protein:#5FB3C6; --fat:#E0AE47; --carb:#8DBB5E; --fiber:#C29B78; --water:#63A9E3; --supp:#B597DA; --over:#E07A61;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--head);color:var(--head-ink);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.brand{font:700 22px/1 var(--num);letter-spacing:.01em}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button{background:transparent;border:0;color:inherit;font:600 20px/1 var(--num);width:36px;height:36px;border-radius:8px;cursor:pointer}
.datenav button:hover{background:rgba(255,255,255,.1)}
.datenav .dlabel{font:600 18px/1 var(--num);min-width:104px;text-align:center;background:transparent;border:0;cursor:pointer;color:inherit}

main{max-width:680px;margin:0 auto;padding:16px}
h2{font:600 22px/1.15 var(--num);margin:0 0 12px}
h3{font:600 17px/1.2 var(--num);margin:0 0 8px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.hint{color:var(--muted);font-size:14px;margin:4px 0 10px}
.empty{color:var(--muted);font-size:15px;padding:6px 0}

/* fuel gauge hero */
.tank{background:var(--head);color:var(--head-ink);border-radius:14px;padding:18px 18px 14px;margin-bottom:14px}
.tank-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.big{font:700 52px/0.95 var(--num);letter-spacing:-.01em}
.mid{font:600 30px/1 var(--num)}
.sub{font-size:14px;opacity:.75;margin-top:4px}
.right{text-align:right}
.gauge{position:relative;height:18px;border-radius:9px;background:rgba(255,255,255,.14);margin-top:16px;overflow:hidden}
.gfill{position:absolute;inset:0 auto 0 0;background:#E9B949;border-radius:9px;transition:width .4s ease}
.gfill.over{background:#E07A61}
.tick{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.25)}
.gscale{display:flex;justify-content:space-between;font:600 14px/1 var(--num);opacity:.7;margin-top:6px}

.row{margin:12px 0}
.row:first-child{margin-top:0}
.rowtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.rowtop .lbl{font-weight:600}
.rowtop .val{font:600 18px/1 var(--num)}
.rowtop .val small{font:500 14px/1 var(--body);color:var(--muted)}
.track{height:9px;border-radius:5px;background:var(--track);overflow:hidden}
.fill{height:100%;border-radius:5px;transition:width .4s ease}
.micros{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.micros .row{margin:8px 0}
.micros .rowtop .lbl{font-weight:500;font-size:14px}
.micros .rowtop .val{font-size:15px}
.micros .track{height:6px}

/* checklist */
.doses{display:flex;flex-direction:column;gap:8px}
.dose{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.dose .box{flex:0 0 24px;height:24px;border-radius:6px;border:2px solid var(--supp);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.dose.on .box{background:var(--supp)}
.dose.on .dname{text-decoration:line-through;color:var(--muted)}
.dname{font-weight:600}
.dmeta{font-size:13px;color:var(--muted)}

/* forms */
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:14px;font-weight:600}
.fld > span{font-weight:600}
input[type=text],input[type=number],input[type=search],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.btn{background:var(--accent);color:var(--surface);border:0;border-radius:9px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--over);border:1px solid var(--over)}
.btn.wide{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.icon{background:transparent;border:0;color:var(--muted);font-size:22px;line-height:1;width:36px;height:36px;border-radius:8px;cursor:pointer;flex:0 0 36px}
.icon:hover{background:var(--track);color:var(--over)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:7px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.searchbar{display:flex;gap:8px}
.searchbar input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:500;font-size:14px}
.chip input:checked + span{background:var(--supp);border-color:var(--supp);color:#fff}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.nutrow{display:grid;grid-template-columns:1fr 90px 74px 36px;gap:6px;align-items:center;margin-bottom:6px}
.nutrow select,.nutrow input{padding:8px}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .main{flex:1;min-width:0}
.list .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.list .m{font-size:13px;color:var(--muted)}
.list .k{font:600 17px/1 var(--num);white-space:nowrap}
.pick{flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:0;cursor:pointer}
.mealhead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 2px}
.mealhead:first-of-type{margin-top:0}
.mealhead h3{margin:0}
.mealhead span{font:600 15px/1 var(--num);color:var(--muted)}
.macros-line{font-size:13px;color:var(--muted)}
.macros-line b{font-weight:600;color:var(--ink)}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0;text-align:center}
.preview div{background:var(--bg);border-radius:8px;padding:8px 4px}
.preview .pv{font:700 22px/1 var(--num)}
.preview .pl{font-size:12px;color:var(--muted);margin-top:3px}
.err{color:var(--over);font-size:14px;margin:10px 0 0}
.waterbig{display:flex;align-items:baseline;gap:8px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.quick button{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 4px;font:600 19px/1 var(--num);color:var(--water);cursor:pointer}
.calcout{background:var(--bg);border-radius:10px;padding:12px;margin:6px 0 12px;font-size:14px}
.calcout b{font:600 17px/1 var(--num)}
footer.ver{text-align:center;color:var(--muted);font-size:13px;padding:8px 0 16px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw}

.actions3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.actions2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.actions3 .btn,.actions2 .btn{padding:10px 4px;font-size:14px}
details{margin:6px 0 10px}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
pre.raw{white-space:pre-wrap;font-size:12px;line-height:1.35;background:var(--surface);border:1px solid var(--line);padding:8px;border-radius:8px;max-height:220px;overflow:auto}
#overlay{position:fixed;inset:0;z-index:40;background:rgba(10,16,20,.6);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
#overlay[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:680px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:100%;overflow:auto}
#reader{width:100%;min-height:200px;border-radius:10px;overflow:hidden;background:#000;margin-bottom:8px}
#reader video{width:100%!important;height:auto!important;display:block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;background:transparent;border:0;padding:10px 2px 12px;font:600 15px/1 var(--num);color:var(--muted);cursor:pointer;position:relative}
nav.tabs button svg{display:block;margin:0 auto 4px;width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
@media (max-width:380px){.micros{grid-template-columns:1fr}.big{font-size:44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Fuel Log</div>
  <div class="datenav">
    <button data-action="prevDay" aria-label="Previous day">‹</button>
    <button class="dlabel" data-action="today" id="dlabel" aria-label="Jump to today"></button>
    <button data-action="nextDay" aria-label="Next day">›</button>
  </div>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="labelFile" accept="image/*" hidden>
<input type="file" id="barcodeFile" accept="image/*" hidden>
<div id="overlay" hidden></div>

<script>
const VERSION = 'v1.3';
const STORE = 'fuelLog.v1';

const NUTR = [
  {k:'kcal',      label:'Calories',          unit:'kcal'},
  {k:'protein',   label:'Protein',           unit:'g',   num:['203']},
  {k:'fat',       label:'Fat',               unit:'g',   num:['204']},
  {k:'carbs',     label:'Carbs (total)',     unit:'g',   num:['205','205.2']},
  {k:'fiber',     label:'Fiber',             unit:'g',   num:['291']},
  {k:'sodium',    label:'Sodium',            unit:'mg',  num:['307']},
  {k:'potassium', label:'Potassium',         unit:'mg',  num:['306']},
  {k:'magnesium', label:'Magnesium',         unit:'mg',  num:['304']},
  {k:'calcium',   label:'Calcium',           unit:'mg',  num:['301']},
  {k:'iron',      label:'Iron',              unit:'mg',  num:['303']},
  {k:'zinc',      label:'Zinc',              unit:'mg',  num:['309']},
  {k:'vitd',      label:'Vitamin D',         unit:'mcg', num:['328']},
  {k:'vitc',      label:'Vitamin C',         unit:'mg',  num:['401']},
  {k:'b12',       label:'Vitamin B12',       unit:'mcg', num:['418']},
  {k:'folate',    label:'Folate (DFE)',      unit:'mcg', num:['435','417']},
  {k:'vita',      label:'Vitamin A (RAE)',   unit:'mcg', num:['320']},
  {k:'vitk',      label:'Vitamin K',         unit:'mcg', num:['430']},
  {k:'omega3',    label:'Omega-3 (EPA+DHA)', unit:'mg'}
];
const NMAP = Object.fromEntries(NUTR.map(n => [n.k, n]));
const MICRO_KEYS = ['sodium','potassium','magnesium','calcium','iron','zinc','vitd','vitc','b12','folate','vita','vitk','omega3'];
const MEALS = ['Breakfast','Lunch','Dinner','Snacks'];
const TIMES = ['Morning','Midday','Evening','Bedtime'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const r0 = v => Math.round(v || 0);
const r1 = v => Math.round((v || 0) * 10) / 10;
const fmtN = (v, unit) => (Math.abs(v) < 10 && unit !== 'kcal') ? r1(v) : r0(v).toLocaleString();
const dkey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const zero = () => Object.fromEntries(NUTR.map(n => [n.k, 0]));
const titleCase = s => String(s || '').toLowerCase().replace(/(^|[\s,(/-])([a-z])/g, (m, a, b) => a + b.toUpperCase());

function defaults(){
  return {
    settings:{
      apiKey:'DEMO_KEY', waterGoal:100, carbMode:'net', theme:'auto',
      profile:{sex:'M', age:39, ft:5, inch:10, lb:180, activity:1.55, goal:0, style:'keto', ppl:1.0},
      targets:{kcal:2200, protein:180, fat:150, carbs:30, fiber:30},
      micros:{sodium:3000, potassium:3400, magnesium:420, calcium:1000, iron:8, zinc:11, vitd:15, vitc:90, b12:2.4, folate:400, vita:900, vitk:120, omega3:500}
    },
    library:{}, supplements:[], days:{}
  };
}
function load(){
  const d = defaults();
  try{
    const raw = localStorage.getItem(STORE);
    if(!raw) return d;
    const s = JSON.parse(raw);
    return {
      settings:{...d.settings, ...(s.settings||{}),
        profile:{...d.settings.profile, ...((s.settings||{}).profile||{})},
        targets:{...d.settings.targets, ...((s.settings||{}).targets||{})},
        micros:{...d.settings.micros, ...((s.settings||{}).micros||{})}},
      library:s.library||{}, supplements:s.supplements||[], days:s.days||{}
    };
  }catch(e){ return d; }
}
let S = load();
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify(S)); }
  catch(e){ toast('Could not save. Phone storage may be full or blocked.'); }
}
function day(k){ const d = S.days[k] || (S.days[k] = {food:[], water:[], supps:{}}); if(!d.extra) d.extra = []; return d; }
function autoMeal(){ const h = new Date().getHours(); return h < 11 ? 'Breakfast' : h < 15 ? 'Lunch' : h < 20 ? 'Dinner' : 'Snacks'; }

const ui = {tab:'dash', date:dkey(new Date()), q:'', filter:'whole', results:[], searching:false, err:'', sel:null, meal:autoMeal(), label:null, editSupp:null, histSort:'recent', histAll:false};

function applyTheme(){
  const t = S.settings.theme;
  if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}

let toastTimer;
function toast(msg){
  let el = $('.toast');
  if(!el){ el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2600);
}

/* ---------- math ---------- */
function totals(k){
  const t = zero(); t.water = 0;
  const d = S.days[k]; if(!d) return t;
  (d.food||[]).forEach(f => NUTR.forEach(n => t[n.k] += (f.n && f.n[n.k]) || 0));
  S.supplements.forEach(s => (s.times||[]).forEach(time => {
    if(d.supps && d.supps[s.id + '|' + time]) Object.entries(s.nutrients||{}).forEach(([nk, v]) => { if(nk in t) t[nk] += v; });
  }));
  (d.extra||[]).forEach(x => {
    const sp = S.supplements.find(q => q.id === x.suppId);
    if(sp) Object.entries(sp.nutrients||{}).forEach(([nk, v]) => { if(nk in t) t[nk] += v; });
  });
  t.water = (d.water||[]).reduce((a, w) => a + w.oz, 0);
  return t;
}
function carbShown(t){ return S.settings.carbMode === 'net' ? Math.max(0, t.carbs - t.fiber) : t.carbs; }
function scheduled(k){
  const dow = parseKey(k).getDay();
  const out = [];
  S.supplements.filter(s => s.active !== false && !s.asNeeded && (s.days||[]).includes(dow))
    .forEach(s => TIMES.forEach(time => { if((s.times||[]).includes(time)) out.push({s, time}); }));
  return out;
}
function calc(){
  const p = S.settings.profile;
  const kg = p.lb * 0.453592, cm = ((+p.ft) * 12 + (+p.inch)) * 2.54;
  const bmr = 10*kg + 6.25*cm - 5*p.age + (p.sex === 'M' ? 5 : -161);
  const tdee = bmr * p.activity;
  const kcal = Math.round(tdee * (1 + (+p.goal)) / 10) * 10;
  const protein = Math.round(p.lb * p.ppl);
  let carbs, mode = 'total', fiber = 35;
  if(p.style === 'keto'){ carbs = 25; mode = 'net'; fiber = 25; }
  else if(p.style === 'low'){ carbs = 75; mode = 'net'; fiber = 30; }
  else if(p.style === 'bal'){ carbs = Math.round(kcal * 0.40 / 4); }
  else { carbs = Math.round(kcal * 0.50 / 4); }
  const fat = Math.max(40, Math.round((kcal - protein*4 - carbs*4) / 9));
  return {bmr:Math.round(bmr), tdee:Math.round(tdee), kcal, protein, fat, carbs, fiber, mode};
}

/* ---------- USDA food database ---------- */
function parseFood(f){
  const by = {};
  (f.foodNutrients||[]).forEach(n => {
    if(n.value == null) return;
    const num = String(n.nutrientNumber || '');
    (by[num] || (by[num] = [])).push(n);
  });
  const get = (nums, unit) => {
    for(const num of nums){
      const arr = by[num]; if(!arr) continue;
      const m = unit ? arr.find(x => String(x.unitName||'').toUpperCase() === unit) : arr[0];
      if(m) return Number(m.value) || 0;
    }
    return null;
  };
  const p = zero();
  NUTR.forEach(d => { if(d.num){ const v = get(d.num); p[d.k] = v == null ? 0 : v; } });
  if(!p.vitd){ const iu = get(['324']); if(iu) p.vitd = iu / 40; }
  let kcal = get(['208'], 'KCAL'); if(kcal == null) kcal = get(['958'], 'KCAL'); if(kcal == null) kcal = get(['957'], 'KCAL');
  p.kcal = kcal == null ? (4*p.protein + 4*p.carbs + 9*p.fat) : kcal;
  p.omega3 = ((get(['629'])||0) + (get(['621'])||0)) * 1000;

  const units = [{label:'grams', g:1}, {label:'ounces', g:28.3495}];
  const su = String(f.servingSizeUnit||'').toLowerCase();
  if(f.servingSize && /^(g|grm|ml|mlt)$/.test(su)){
    const u = su.startsWith('m') ? 'ml' : 'g';
    units.push({label:`serving${f.householdServingFullText ? ' · ' + f.householdServingFullText : ''} (${r1(f.servingSize)} ${u})`, g:Number(f.servingSize), serving:true});
  }
  (f.foodMeasures||[]).slice(0, 8).forEach(m => {
    if(m.gramWeight && m.disseminationText && !/not specified/i.test(m.disseminationText))
      units.push({label:`${m.disseminationText} (${r1(m.gramWeight)} g)`, g:Number(m.gramWeight), serving:true});
  });
  const typeLabel = {'Foundation':'USDA whole food','SR Legacy':'USDA whole food','Survey (FNDDS)':'USDA common food','Branded':'Branded'}[f.dataType] || f.dataType;
  return {id:'fdc' + f.fdcId, name:titleCase(f.description), brand:titleCase(f.brandName || f.brandOwner || ''), type:typeLabel, per100:p, units};
}
async function doSearch(){
  const q = ui.q.trim(); if(!q) return;
  ui.searching = true; ui.err = ''; ui.sel = null; ui.results = []; render();
  const types = ui.filter === 'branded' ? ['Branded'] : ['Foundation','SR Legacy','Survey (FNDDS)'];
  try{
    const res = await fetch(`https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(S.settings.apiKey || 'DEMO_KEY')}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({query:q, dataType:types, pageSize:25})
    });
    if(res.status === 429) throw new Error('Search limit reached for this API key. Add your own free USDA key in Settings, or try again in an hour.');
    if(res.status === 401 || res.status === 403) throw new Error('The USDA API key was rejected. Check it in Settings.');
    if(!res.ok) throw new Error(`The food database returned an error (${res.status}). Try again.`);
    const data = await res.json();
    ui.results = (data.foods||[]).map(parseFood);
    if(!ui.results.length) ui.err = 'No matches. Try fewer words, switch between whole foods and branded, or add a custom food.';
  }catch(e){
    ui.err = e instanceof TypeError ? 'Could not reach the food database. Check your connection.' : e.message;
  }
  ui.searching = false; render();
}
function scaled(food, grams){
  const out = {}; const f = grams / 100;
  NUTR.forEach(n => out[n.k] = (food.per100[n.k] || 0) * f);
  return out;
}

/* ---------- small renderers ---------- */
function bar(label, val, target, unit, color, limit){
  const pct = target > 0 ? val / target * 100 : 0;
  const over = limit && pct > 100;
  return `<div class="row"><div class="rowtop"><span class="lbl">${label}</span><span class="val">${fmtN(val, unit)} <small>/ ${fmtN(target, unit)} ${unit}</small></span></div>
  <div class="track" role="progressbar" aria-label="${esc(label)}" aria-valuenow="${r0(pct)}" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:${Math.min(100, pct)}%;background:${over ? 'var(--over)' : color}"></div></div></div>`;
}
function doseList(k){
  const list = scheduled(k);
  const d = S.days[k] || {supps:{}};
  if(!list.length) return `<p class="empty">${S.supplements.length ? 'Nothing scheduled for this day.' : 'No supplements yet. Add them on the Supplements tab.'}</p>`;
  return `<div class="doses">${list.map(({s, time}) => {
    const on = !!(d.supps && d.supps[s.id + '|' + time]);
    return `<button class="dose ${on ? 'on' : ''}" data-action="toggleDose" data-id="${s.id}" data-time="${time}" aria-pressed="${on}">
      <span class="box">${on ? '✓' : ''}</span><span><span class="dname">${esc(s.name)}</span><br><span class="dmeta">${time}${s.dose ? ' · ' + esc(s.dose) : ''}</span></span></button>`;
  }).join('')}</div>`;
}
function extraSummary(k){
  const d = S.days[k]; if(!d || !(d.extra||[]).length) return [];
  const counts = {};
  d.extra.forEach(x => counts[x.suppId] = (counts[x.suppId] || 0) + 1);
  return Object.entries(counts).map(([id, c]) => { const sp = S.supplements.find(q => q.id === id); return sp ? {sp, c} : null; }).filter(Boolean);
}
function macroLine(n){
  return `<span class="macros-line">${r0(n.kcal)} kcal · P <b>${r0(n.protein)}</b> · F <b>${r0(n.fat)}</b> · C <b>${r0(S.settings.carbMode==='net' ? Math.max(0, n.carbs - n.fiber) : n.carbs)}</b>${S.settings.carbMode==='net' ? ' net' : ''}</span>`;
}

const LIB_SCAN = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
const LIB_OCR = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const libs = {};
function loadScript(src){
  if(!libs[src]) libs[src] = new Promise((res, rej) => {
    const el = document.createElement('script'); el.src = src; el.async = true;
    el.onload = () => res();
    el.onerror = () => { delete libs[src]; el.remove(); rej(new Error('Could not load the scanner tools. Check your connection.')); };
    document.head.appendChild(el);
  });
  return libs[src];
}
let qr = null, scanTarget = 'food', ocrTarget = 'food', ocrRun = 0;
function scanConfig(){
  const F = Html5QrcodeSupportedFormats;
  return {formatsToSupport:[F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E], verbose:false};
}
function showOverlay(html){ const o = $('#overlay'); o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; o.hidden = false; }
function setStatus(t){ const el = $('#ovStatus'); if(el) el.textContent = t; }
async function stopCamera(){
  if(!qr) return;
  const q = qr; qr = null;
  try{ if(q.isScanning) await q.stop(); q.clear(); }catch(e){}
}
async function hideOverlay(){ await stopCamera(); const o = $('#overlay'); o.hidden = true; o.innerHTML = ''; }

async function openScanner(target){
  scanTarget = target;
  showOverlay(`<h2>Scan barcode</h2><div id="reader"></div>
    <p class="hint" id="ovStatus" aria-live="polite">Starting camera…</p>
    <div class="btns"><button class="btn ghost" data-action="barcodePhoto">Use a photo instead</button><button class="btn ghost" data-action="closeScan">Cancel</button></div>
    <form class="searchbar" id="codeForm" style="margin-top:12px"><input type="text" id="codeIn" inputmode="numeric" placeholder="Or type the barcode number" aria-label="Barcode number"><button class="btn" type="submit">Look up</button></form>`);
  try{
    await loadScript(LIB_SCAN);
    if($('#overlay').hidden) return;
    qr = new Html5Qrcode('reader', scanConfig());
    let done = false;
    await qr.start({facingMode:'environment'},
      {fps:10, qrbox:(w, h) => ({width:Math.floor(Math.min(w * 0.9, 340)), height:Math.floor(Math.min(h * 0.45, 170))})},
      code => { if(done) return; done = true; handleCode(code); }, () => {});
    setStatus('Hold the barcode inside the box.');
  }catch(e){
    const m = String((e && e.message) || e);
    setStatus(/permission|notallowed/i.test(m) ? 'Camera access is blocked. Allow camera access for this site, or use a photo or type the number below.'
      : m.includes('Could not load') ? m : 'Could not start the camera. Use a photo or type the number below.');
  }
}
async function handleCode(raw){
  const code = String(raw || '').replace(/\D/g, '');
  await stopCamera();
  if(code.length < 8){ setStatus('That barcode could not be read. Try a photo or type the number.'); return; }
  setStatus(`Looking up ${code}…`);
  try{
    const res = await lookupBarcode(code);
    if(!res){ setStatus(`${code} is not in the food databases. Close this and use Photo of label instead.`); return; }
    await hideOverlay();
    const label = res.food.name + (res.food.brand ? ` (${res.food.brand})` : '');
    if(scanTarget === 'supp'){
      applyToSupp(res.servingN, label, res.servingLabel, '');
      toast(res.servingN ? 'Check the values against the label' : 'Found the name only. Use Photo of label for nutrients.');
    } else {
      ui.tab = 'food'; ui.results = []; ui.err = ''; ui.label = null; selectFood(res.food);
      toast(`Found ${res.food.name}`);
    }
    render();
  }catch(e){
    setStatus(e instanceof TypeError ? 'Could not reach the food databases. Check your connection.' : e.message);
  }
}

const OFF_MAP = [['kcal','energy-kcal',1],['protein','proteins',1],['fat','fat',1],['carbs','carbohydrates',1],['fiber','fiber',1],
  ['sodium','sodium',1e3],['potassium','potassium',1e3],['magnesium','magnesium',1e3],['calcium','calcium',1e3],['iron','iron',1e3],['zinc','zinc',1e3],
  ['vitd','vitamin-d',1e6],['vitc','vitamin-c',1e3],['b12','vitamin-b12',1e6],['folate','folates',1e6],['vita','vitamin-a',1e6],['vitk','vitamin-k',1e6]];
function offVals(n, suffix){
  const o = zero(); let any = false;
  OFF_MAP.forEach(([k, key, f]) => { const v = Number(n[key + suffix]); if(isFinite(v) && v > 0){ o[k] = v * f; any = true; } });
  const epa = Number(n['eicosapentaenoic-acid' + suffix]) || 0, dha = Number(n['docosahexaenoic-acid' + suffix]) || 0;
  if(epa + dha > 0){ o.omega3 = (epa + dha) * 1000; any = true; }
  if(!o.kcal){ const kj = Number(n['energy' + suffix]); if(kj > 0) o.kcal = kj / 4.184; }
  return any ? o : null;
}
function parseOFF(p, code){
  const n = p.nutriments || {};
  const per = offVals(n, '_100g'), serv = offVals(n, '_serving');
  const name = titleCase(p.product_name || 'Scanned product'), brand = titleCase(String(p.brands || '').split(',')[0]);
  if(!per && !serv) return {food:{id:'off' + code, name, brand, type:'Open Food Facts', per100:zero(), units:[{label:'grams', g:1}]}, servingN:null, servingLabel:p.serving_size || '', empty:true};
  const sq = Number(p.serving_quantity);
  let food;
  if(per){
    const units = [{label:'grams', g:1}, {label:'ounces', g:28.3495}];
    if(sq > 0) units.push({label:`serving${p.serving_size ? ' · ' + p.serving_size : ''} (${r1(sq)} g)`, g:sq, serving:true});
    food = {id:'off' + code, name, brand, type:'Open Food Facts', per100:per, units};
  } else {
    food = {id:'off' + code, name, brand, type:'Open Food Facts', per100:serv, units:[{label:`serving${p.serving_size ? ' · ' + p.serving_size : ''}`, g:100, serving:true}]};
  }
  return {food, servingN: serv || (per && sq > 0 ? scaled(food, sq) : null), servingLabel:p.serving_size || ''};
}
async function lookupBarcode(code){
  let nameOnly = null;
  const tries = [code]; if(code.length === 12) tries.push('0' + code);
  for(const c of tries){
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${c}.json?fields=product_name,brands,nutriments,serving_size,serving_quantity`);
    if(!r.ok) continue;
    const d = await r.json();
    if(d.status === 1 && d.product){
      const out = parseOFF(d.product, c);
      if(!out.empty) return out;
      nameOnly = out;
    }
  }
  try{
    const r = await fetch(`https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(S.settings.apiKey || 'DEMO_KEY')}`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({query:code, dataType:['Branded'], pageSize:10})});
    if(r.ok){
      const d = await r.json();
      const strip = v => String(v || '').replace(/^0+/, '');
      const hit = (d.foods || []).find(f => strip(f.gtinUpc) === strip(code));
      if(hit){
        const food = parseFood(hit); const sv = food.units.find(u => u.serving);
        return {food, servingN: sv ? scaled(food, sv.g) : null, servingLabel: sv ? sv.label : ''};
      }
    }
  }catch(e){}
  if(nameOnly && scanTarget === 'supp') return nameOnly;
  return null;
}
function applyToSupp(n, name, serving, raw){
  const s = ui.editSupp; if(!s) return;
  if(name && !s.name.trim()) s.name = name;
  if(serving && !s.dose.trim()) s.dose = serving;
  if(n){
    const rows = [];
    NUTR.forEach(d => { const v = n[d.k]; if(v > 0) rows.push({k:d.k, amt:String(Math.round(v * 100) / 100), u:d.unit}); });
    if(rows.length) s.nuts = rows;
  }
  s.raw = raw || '';
}

async function prepImage(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('That photo could not be opened.')); i.src = url; });
    const sc = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
    const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
    for(let i = 0; i < p.length; i += 4){
      let g = 0.299*p[i] + 0.587*p[i+1] + 0.114*p[i+2];
      g = Math.max(0, Math.min(255, (g - 128) * 1.5 + 128));
      p[i] = p[i+1] = p[i+2] = g;
    }
    x.putImageData(d, 0, 0);
    return c;
  } finally { URL.revokeObjectURL(url); }
}
const OCR_FIELDS = [
  ['fat',['total\\s*fat']], ['protein',['\\bprotein']], ['carbs',['total\\s*carb\\w*\\.?','\\bcarbohydrates?\\b']], ['fiber',['dietary\\s*fib\\w*','\\bfib(?:er|re)\\b']],
  ['sodium',['\\bsodium\\b']], ['potassium',['\\bpotassium\\b']], ['magnesium',['\\bmagnesium\\b']], ['calcium',['\\bcalcium\\b']], ['iron',['\\biron\\b']], ['zinc',['\\bzinc\\b']],
  ['vitd',['vitamin\\s*d\\d?\\b']], ['vitc',['vitamin\\s*c\\b']], ['b12',['vitamin\\s*b\\s?-?\\s?12','\\bb\\s?-?12\\b']], ['folate',['\\bfolate\\b','folic\\s*acid']],
  ['vita',['vitamin\\s*a\\b']], ['vitk',['vitamin\\s*k\\d?\\b']], ['epa',['\\bepa\\b','eicosapentaenoic']], ['dha',['\\bdha\\b','docosahexaenoic']]
];
const UNIT_F = {g:1e6, mg:1e3, mcg:1};
function toUnit(v, u, key, target){
  if(u === 'iu'){ if(key === 'vitd') return v / 40; if(key === 'vita') return v * 0.3; return null; }
  return v * UNIT_F[u] / UNIT_F[target];
}
function parseLabel(text){
  const t = text.replace(/[µμ]g/gi, 'mcg').replace(/(\d|\b)(meg|mcq|mog|ug)\b/gi, '$1mcg')
    .replace(/\bO(\s?m?c?g)\b/g, '0$1').replace(/(\d),(\d{3})\b/g, '$1$2');
  const n = zero(), extra = {}; let found = 0;
  const amt = '(\\d+(?:\\.\\d+)?)\\s*(mcg|mg|g|iu)\\b';
  OCR_FIELDS.forEach(([k, pats]) => {
    const target = (k === 'epa' || k === 'dha') ? 'mg' : NMAP[k].unit;
    for(const p of pats){
      const m = new RegExp(p + '[^\\n]{0,50}?' + amt, 'i').exec(t) || new RegExp(p + '[\\s\\S]{0,25}?' + amt, 'i').exec(t);
      if(!m) continue;
      const v = toUnit(parseFloat(m[1]), m[2].toLowerCase(), k, target);
      if(v != null){ if(k === 'epa' || k === 'dha') extra[k] = v; else n[k] = v; found++; }
      break;
    }
  });
  if(extra.epa || extra.dha) n.omega3 = (extra.epa || 0) + (extra.dha || 0);
  const cm = /calories[^\n\d]{0,20}(\d{1,4})\b/i.exec(t); if(cm){ n.kcal = +cm[1]; found++; }
  const sm = /serving\s*size[:\s]*([^\n]{1,40})/i.exec(t);
  const serving = sm ? sm[1].trim() : '';
  const gm = serving ? /(\d+(?:\.\d+)?)\s*(g|ml)\b/i.exec(serving) : null;
  return {n, found, serving, servG: gm ? parseFloat(gm[1]) : 0, raw: text.trim()};
}
async function runOCR(file, target){
  const run = ++ocrRun;
  showOverlay(`<h2>Reading label</h2><p class="hint" id="ovStatus" aria-live="polite">Preparing photo…</p>
    <p class="hint">The first scan downloads the text reader, which can take 20 to 30 seconds.</p>
    <div class="btns"><button class="btn ghost" data-action="closeScan">Cancel</button></div>`);
  try{
    const canvas = await prepImage(file);
    setStatus('Loading text reader…');
    await loadScript(LIB_OCR);
    const {data} = await Tesseract.recognize(canvas, 'eng', {logger: m => { if(run === ocrRun && m.status === 'recognizing text') setStatus(`Reading label ${Math.round((m.progress || 0) * 100)}%`); }});
    if(run !== ocrRun) return;
    const parsed = parseLabel(data.text || '');
    await hideOverlay();
    if(target === 'supp'){
      applyToSupp(parsed.found ? parsed.n : null, '', parsed.serving, parsed.raw);
      toast(parsed.found ? 'Check the values against the label' : 'No nutrients recognized. Enter them by hand.');
    } else {
      ui.tab = 'food'; ui.sel = null; ui.results = []; ui.err = '';
      ui.label = {fromScan:true, name:'', serving:parsed.serving, servG:parsed.servG, n:parsed.n, raw:parsed.raw};
      toast(parsed.found >= 3 ? 'Check the values against the label' : 'Few values recognized. Fill in the rest by hand.');
    }
    render();
  }catch(e){
    if(run === ocrRun) setStatus((e && e.message) || 'Could not read the photo. Try again with better light.');
  }
}

/* ---------- food history ---------- */
const isCustom = f => String(f.id).startsWith('custom');
function myFoods(q, sort){
  const term = String(q || '').trim().toLowerCase();
  let list = Object.values(S.library);
  if(term) list = list.filter(f => `${f.name} ${f.brand || ''}`.toLowerCase().includes(term));
  if(sort === 'used') list.sort((a, b) => (b.count || 0) - (a.count || 0) || (b.lastUsed || 0) - (a.lastUsed || 0));
  else if(sort === 'custom') list = list.filter(isCustom).sort((a, b) => a.name.localeCompare(b.name));
  else list.sort((a, b) => (b.lastUsed || 0) - (a.lastUsed || 0));
  return list;
}
function foodItems(list){
  return list.map(f => {
    const meta = [f.lastAmount ? `last: ${f.lastAmount}` : '', f.count ? `logged ${f.count}×` : '', isCustom(f) ? 'custom' : ''].filter(Boolean).join(' · ');
    return `<li><button class="pick" data-action="pickRecent" data-id="${esc(f.id)}"><div class="t">${esc(f.name)}${f.brand ? ` <span class="m">${esc(f.brand)}</span>` : ''}</div><div class="m">${esc(meta || 'saved')}</div></button>
      ${isCustom(f) ? `<button class="icon" data-action="editFood" data-id="${esc(f.id)}" aria-label="Edit ${esc(f.name)}">✎</button>` : ''}
      <button class="icon" data-action="forgetFood" data-id="${esc(f.id)}" aria-label="Remove ${esc(f.name)}">×</button></li>`;
  }).join('');
}
function myFoodsHTML(){
  if(!Object.keys(S.library).length) return `<p class="empty">Foods you log or save show up here for one-tap re-adding.</p>`;
  const all = myFoods(ui.q, ui.histSort);
  const shown = all.slice(0, ui.histAll ? 300 : 15);
  const seg = `<div class="seg" role="group" aria-label="Sort my foods">${[['recent','Recent'],['used','Most used'],['custom','My custom']].map(([k, l]) => `<button data-action="histSort" data-s="${k}" class="${ui.histSort === k ? 'on' : ''}" aria-pressed="${ui.histSort === k}">${l}</button>`).join('')}</div>`;
  const body = shown.length ? `<ul class="list">${foodItems(shown)}</ul>`
    : `<p class="empty">${ui.q.trim() ? 'No saved foods match. Tap Search to check the database.' : 'No custom foods yet.'}</p>`;
  const more = all.length > shown.length ? `<button class="btn ghost wide" style="margin-top:8px" data-action="histAll">Show all ${all.length}</button>` : '';
  return seg + body + more;
}
function deriveLabel(f){
  const u0 = f.units[0];
  if(u0 && u0.serving && f.units.some(u => u.label === 'grams')){
    const m = /^serving · (.*) \([\d.]+ g\)$/.exec(u0.label);
    return {serving: m ? m[1] : u0.label, servG:u0.g, n:scaled(f, u0.g)};
  }
  return {serving: u0 ? u0.label : 'serving', servG:0, n:{...f.per100}};
}

function loadDraft(){
  try{
    const d = JSON.parse(localStorage.getItem(DRAFT) || 'null');
    if(!d || Date.now() - d.t > 3 * 864e5) return;
    ui.tab = d.tab || ui.tab; ui.q = d.q || ''; ui.label = d.label || null; ui.editSupp = d.editSupp || null;
    ui.sel = d.sel || null; ui.histSort = d.histSort || 'recent';
    if(Date.now() - d.t < 6 * 36e5){ if(d.date) ui.date = d.date; if(d.meal) ui.meal = d.meal; }
  }catch(e){}
}

/* ---------- actions ---------- */
function shiftDay(n){ const d = parseKey(ui.date); d.setDate(d.getDate() + n); ui.date = dkey(d); ui.sel = null; }
function selectFood(food){
  const si = food.units.findIndex(u => u.serving);
  ui.sel = {food, unit: si >= 0 ? si : 0, qty: si >= 0 ? 1 : 100};
  if(food.lastUnit != null && food.units[food.lastUnit]){ ui.sel.unit = food.lastUnit; ui.sel.qty = food.lastQty; }
}
const A = {
  tab: el => { ui.tab = el.dataset.tab; window.scrollTo(0, 0); },
  prevDay: () => shiftDay(-1),
  nextDay: () => shiftDay(1),
  today: () => { ui.date = dkey(new Date()); },
  toggleDose: el => { const d = day(ui.date); const key = el.dataset.id + '|' + el.dataset.time; if(d.supps[key]) delete d.supps[key]; else d.supps[key] = true; save(); },
  meal: el => { ui.meal = el.dataset.meal; },
  filter: el => { ui.filter = el.dataset.f; ui.results = []; ui.err = ''; ui.sel = null; },
  pickResult: el => selectFood(ui.results[+el.dataset.i]),
  pickRecent: el => { const f = S.library[el.dataset.id]; if(f) selectFood(f); },
  forgetFood: el => {
    const f = S.library[el.dataset.id]; if(!f) return false;
    if(isCustom(f) && !confirm(`Delete ${f.name}? It is a custom food, so it cannot be found again by search.`)) return false;
    delete S.library[el.dataset.id]; save();
  },
  cancelSel: () => { ui.sel = null; },
  clearResults: () => { ui.results = []; ui.err = ''; },
  addFood: () => {
    const s = ui.sel; const qty = Number(s.qty);
    if(!(qty > 0)){ toast('Enter an amount greater than zero.'); return false; }
    const u = s.food.units[s.unit];
    const amount = u.label === 'grams' ? `${r1(qty)} g` : u.label === 'ounces' ? `${r1(qty)} oz` : u.label === 'serving' ? `${r1(qty)} serving${qty === 1 ? '' : 's'}` : `${r1(qty)} × ${u.label}`;
    day(ui.date).food.push({id:uid(), meal:ui.meal, name:s.food.name + (s.food.brand ? ` (${s.food.brand})` : ''), amount, n:scaled(s.food, qty * u.g), foodId:s.food.id, t:Date.now()});
    const prevF = S.library[s.food.id];
    S.library[s.food.id] = {...s.food, labelData:(prevF && prevF.labelData) || s.food.labelData, count:((prevF && prevF.count) || 0) + 1, lastUsed:Date.now(), lastUnit:s.unit, lastQty:qty, lastAmount:amount};
    ui.sel = null; ui.results = []; ui.q = ''; save(); toast(`Added to ${ui.meal}`);
  },
  delFood: el => { const d = day(ui.date); d.food = d.food.filter(f => f.id !== el.dataset.id); save(); },
  scanFood: () => { ui.label = null; openScanner('food'); return false; },
  photoFood: () => { ocrTarget = 'food'; $('#labelFile').click(); return false; },
  customFood: () => { ui.sel = null; ui.results = []; ui.err = ''; ui.label = {fromScan:false, name:'', serving:'', servG:0, n:zero(), raw:''}; },
  cancelLabel: () => { ui.label = null; },
  saveLabel: () => {
    const L = ui.label;
    const name = String(L.name || '').trim(); if(!name){ toast('Give the food a name.'); return false; }
    const serving = String(L.serving || '').trim() || 'serving';
    const servG = Number(L.servG) || 0;
    const n = zero(); NUTR.forEach(d => n[d.k] = Number(L.n[d.k]) || 0);
    if(!n.kcal) n.kcal = 4*n.protein + 4*n.carbs + 9*n.fat;
    const prev = L.editId ? S.library[L.editId] : null;
    const type = prev ? prev.type : L.fromScan ? 'From label photo' : 'Custom';
    const id = L.editId || 'custom' + uid();
    let food;
    if(servG > 0){
      const per = zero(); NUTR.forEach(d => per[d.k] = n[d.k] * 100 / servG);
      food = {id, name, brand:'', type, per100:per, units:[{label:`serving · ${serving} (${r1(servG)} g)`, g:servG, serving:true}, {label:'grams', g:1}, {label:'ounces', g:28.3495}]};
    } else {
      food = {id, name, brand:'', type, per100:n, units:[{label:serving, g:100, serving:true}]};
    }
    food.labelData = {serving, servG, n};
    if(prev){
      const keep = {count:prev.count, lastUsed:prev.lastUsed, lastAmount:prev.lastAmount};
      if(prev.lastUnit != null && food.units[prev.lastUnit] && JSON.stringify(prev.units) === JSON.stringify(food.units)){ keep.lastUnit = prev.lastUnit; keep.lastQty = prev.lastQty; }
      S.library[id] = {...food, ...keep}; save();
      ui.label = null; toast('Changes saved. Past log entries keep their original values.');
      return;
    }
    S.library[id] = {...food, lastUsed:Date.now()}; save();
    ui.label = null; selectFood(food); toast('Saved. Choose the amount.');
  },
  editFood: el => {
    const f = S.library[el.dataset.id]; if(!f) return false;
    const ld = f.labelData || deriveLabel(f);
    ui.sel = null; ui.results = []; ui.err = '';
    ui.label = {editId:f.id, fromScan:false, name:f.name, serving:ld.serving, servG:ld.servG, n:{...zero(), ...ld.n}, raw:''};
    window.scrollTo(0, 0);
  },
  histSort: el => { ui.histSort = el.dataset.s; ui.histAll = false; },
  histAll: () => { ui.histAll = true; },
  scanSupp: () => { syncSuppForm(); openScanner('supp'); return false; },
  photoSupp: () => { syncSuppForm(); ocrTarget = 'supp'; $('#labelFile').click(); return false; },
  barcodePhoto: () => { $('#barcodeFile').click(); return false; },
  closeScan: () => { ocrRun++; hideOverlay(); return false; },
  logExtra: el => { const sp = S.supplements.find(q => q.id === el.dataset.id); day(ui.date).extra.push({id:uid(), suppId:el.dataset.id, t:Date.now()}); save(); toast(`Logged ${sp ? sp.name : 'dose'}`); },
  delExtra: el => { const d = day(ui.date); d.extra = d.extra.filter(x => x.id !== el.dataset.id); save(); },
  water: el => { day(ui.date).water.push({id:uid(), oz:+el.dataset.oz, t:Date.now()}); save(); },
  waterCustom: () => { const oz = Number($('#wCustom').value); if(!(oz > 0)){ toast('Enter ounces greater than zero.'); return false; } day(ui.date).water.push({id:uid(), oz, t:Date.now()}); save(); },
  delWater: el => { const d = day(ui.date); d.water = d.water.filter(w => w.id !== el.dataset.id); save(); },
  newSupp: () => { ui.editSupp = {isNew:true, id:uid(), name:'', dose:'', times:['Morning'], days:[0,1,2,3,4,5,6], nuts:[], notes:'', active:true, asNeeded:false}; window.scrollTo(0, 0); },
  editSupp: el => { const s = S.supplements.find(x => x.id === el.dataset.id); if(s){ ui.editSupp = JSON.parse(JSON.stringify({...s, nuts:s.nuts || []})); window.scrollTo(0, 0); } },
  suppAddNut: () => { syncSuppForm(); ui.editSupp.nuts.push({k:'vitd', amt:'', u:'IU'}); },
  suppDelNut: el => { syncSuppForm(); ui.editSupp.nuts.splice(+el.dataset.i, 1); },
  cancelSupp: () => { ui.editSupp = null; },
  delSupp: () => { if(!confirm('Delete this supplement? Past check-offs stop counting toward totals.')) return false; S.supplements = S.supplements.filter(x => x.id !== ui.editSupp.id); ui.editSupp = null; save(); },
  saveSupp: () => {
    syncSuppForm(); const s = ui.editSupp;
    if(!s.name.trim()){ toast('Give the supplement a name.'); return false; }
    if(!s.asNeeded && !s.times.length){ toast('Pick at least one time of day, or choose As needed only.'); return false; }
    if(!s.asNeeded && !s.days.length){ toast('Pick at least one day, or choose As needed only.'); return false; }
    const nutrients = {};
    s.nuts = s.nuts.filter(n => Number(n.amt) > 0);
    s.nuts.forEach(n => { const base = n.u === 'IU' ? Number(n.amt) / 40 : Number(n.amt); nutrients[n.k] = (nutrients[n.k] || 0) + base; });
    const rec = {id:s.id, name:s.name.trim(), dose:s.dose.trim(), times:TIMES.filter(t => s.times.includes(t)), days:s.days.sort(), nuts:s.nuts, nutrients, notes:s.notes.trim(), active:s.active, asNeeded:!!s.asNeeded};
    const i = S.supplements.findIndex(x => x.id === s.id);
    if(i >= 0) S.supplements[i] = rec; else S.supplements.push(rec);
    ui.editSupp = null; save(); toast('Supplement saved');
  },
  applyCalc: () => { const c = calc(); Object.assign(S.settings.targets, {kcal:c.kcal, protein:c.protein, fat:c.fat, carbs:c.carbs, fiber:c.fiber}); S.settings.carbMode = c.mode; save(); toast('Targets updated'); },
  exportJson: () => {
    download(`fuel-log-backup-${dkey(new Date())}.json`, JSON.stringify(S, null, 2), 'application/json'); return false;
  },
  importJson: () => { $('#importFile').click(); return false; },
  exportCsv: () => {
    const cols = ['kcal','protein','fat','carbs','fiber', ...MICRO_KEYS];
    const rows = [['date', ...cols.map(k => `${k}_${NMAP[k].unit}`), 'net_carbs_g', 'water_oz', 'doses_taken', 'doses_scheduled', 'as_needed_doses'].join(',')];
    Object.keys(S.days).sort().forEach(k => {
      const t = totals(k); const sc = scheduled(k); const d = S.days[k];
      const taken = sc.filter(x => d.supps && d.supps[x.s.id + '|' + x.time]).length;
      rows.push([k, ...cols.map(c => r1(t[c])), r1(Math.max(0, t.carbs - t.fiber)), r1(t.water), taken, sc.length, (d.extra || []).length].join(','));
    });
    download(`fuel-log-daily-${dkey(new Date())}.csv`, rows.join('\n'), 'text/csv'); return false;
  },
  resetAll: () => { if(!confirm('Erase every log, supplement, and setting on this phone? Export a backup first if you want to keep it.')) return false; S = defaults(); save(); applyTheme(); toast('All data erased'); }
};
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if(!el) return;
  const fn = A[el.dataset.action]; if(!fn) return;
  e.preventDefault();
  syncForms();
  if(fn(el, e) !== false) render();
  queueDraft();
});
document.addEventListener('submit', e => {
  if(e.target.id === 'searchForm'){ e.preventDefault(); ui.q = $('#q').value; doSearch(); }
  if(e.target.id === 'codeForm'){ e.preventDefault(); handleCode($('#codeIn').value); }
});
document.addEventListener('input', e => {
  if(e.target.id === 'q'){ ui.q = e.target.value; ui.histAll = false; const mf = $('#myFoods'); if(mf) mf.innerHTML = myFoodsHTML(); }
  if(e.target.id === 'qty' && ui.sel){ ui.sel.qty = e.target.value; $('#preview').innerHTML = previewHTML(); }
  syncForms(); queueDraft();
});
document.addEventListener('change', e => {
  const t = e.target;
  syncForms(); queueDraft();
  if(t.id === 'unit' && ui.sel){
    ui.sel.unit = +t.value;
    const u = ui.sel.food.units[ui.sel.unit];
    ui.sel.qty = u.label === 'grams' ? 100 : u.label === 'ounces' ? 4 : 1;
    $('#qty').value = ui.sel.qty; $('#preview').innerHTML = previewHTML(); return;
  }
  if(t.name === 'sMode'){ render(); return; }
  if(t.classList.contains('nk')){ syncSuppForm(); const i = [...document.querySelectorAll('#nutRows .nk')].indexOf(t); ui.editSupp.nuts[i].u = NMAP[t.value].unit; render(); return; }
  if(t.dataset.path){
    const parts = t.dataset.path.split('.'); const last = parts.pop();
    const obj = parts.reduce((o, k) => o[k], S);
    let v = t.value;
    if(t.type === 'number'){ v = Number(v); if(!isFinite(v) || v < 0){ toast('Enter a number zero or higher.'); render(); return; } }
    else if(t.tagName === 'SELECT' && ['activity','goal'].includes(last)) v = Number(v);
    else if(t.tagName === 'INPUT') v = v.trim();
    obj[last] = v; save();
    if(last === 'theme') applyTheme();
    if(t.dataset.path.startsWith('settings.profile')) render();
  }
});
$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      if(!data || typeof data !== 'object' || !data.settings || !data.days) throw new Error();
      if(!confirm('Replace everything on this phone with this backup?')) return;
      localStorage.setItem(STORE, JSON.stringify(data)); S = load(); applyTheme(); render(); toast('Backup restored');
    }catch(err){ toast('That file is not a Fuel Log backup.'); }
    e.target.value = '';
  };
  r.readAsText(file);
});
document.addEventListener('visibilitychange', () => {
  syncForms();
  if(document.hidden) saveDraft(); else render();
});
window.addEventListener('pagehide', () => { syncForms(); saveDraft(); });

$('#labelFile').addEventListener('change', e => {
  const file = e.target.files[0]; e.target.value = '';
  if(file) runOCR(file, ocrTarget);
});
$('#barcodeFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  setStatus('Reading barcode from photo…');
  try{
    await loadScript(LIB_SCAN);
    await stopCamera();
    const tmp = new Html5Qrcode('reader', scanConfig());
    const code = await tmp.scanFile(file, false);
    try{ tmp.clear(); }catch(_){}
    handleCode(code);
  }catch(err){ setStatus('No barcode found in that photo. Try a closer, sharper photo, or type the number below.'); }
});

loadDraft();
applyTheme();
render();
</script>
